[project]
name = "code-katas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_functions = ["test_*", "it_*"]
python_classes = ["Test*", "It*"]
python_files = ["*.test.py", "test_*.py", "*_test.py"]
addopts = ["-s", "-v", "--tb=short", "--no-header"]
